services:
  edb-jobs-server:
    container_name: edb-job-server
    profiles:
      - prod
      - dev
    build:
      context: .
      ssh:
        - default
      dockerfile: edb-jobs-server/Dockerfile
    env_file:
      - ./.env
    volumes:
      - ./data/logs:/app/logs
